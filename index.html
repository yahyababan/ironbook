<title>Ironbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: single-column phone app. Content scrolls, tab bar is pinned to the bottom edge. */
:root{
  --bg:#eceff0; --surface:#ffffff; --surface2:#e3e8ea; --ink:#12181b; --muted:#5c6a70; --line:#cfd7da;
  --accent:#0a6b5c; --accent-ink:#ffffff; --good:#1f7a3a; --bad:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1417; --surface:#182024; --surface2:#222d32; --ink:#e8eef0; --muted:#8fa0a7; --line:#2b383e;
  --accent:#4fd1b5; --accent-ink:#06211b; --good:#6fd18a; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1417; --surface:#182024; --surface2:#222d32; --ink:#e8eef0; --muted:#8fa0a7; --line:#2b383e;
  --accent:#4fd1b5; --accent-ink:#06211b; --good:#6fd18a; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 var(--body);
  padding-block:16px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1}
h2{font-size:22px}
h3{font-size:19px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.date{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.stat b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:10px 14px;min-height:44px;font-weight:600}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.small{min-height:36px;padding:6px 10px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:0;flex:1 1 140px}
.day-btn small{color:var(--muted);font-weight:500}
.day-btn.next{border-color:var(--accent)}
.day-btn .tag{color:var(--accent);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px;min-width:0;width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>input[type=text]{flex:1}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.last{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.set{display:grid;grid-template-columns:24px 1fr 14px 1fr 40px;gap:8px;align-items:center}
.set .n{color:var(--muted);font:700 16px var(--display);text-align:center}
.set input{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.set .x{color:var(--muted);text-align:center}
.set button{padding:0;min-height:40px}
.colhead{display:grid;grid-template-columns:24px 1fr 14px 1fr 40px;gap:8px;text-align:center}
.empty{color:var(--muted);padding:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;min-height:36px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.hist-line{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;font-size:14px}
.hist-line span:first-child{font-weight:600}
.hist-line span:last-child{color:var(--muted);text-align:right}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 10px var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2;fill:none}
.chart .dot{fill:var(--accent)}
.chart .end{fill:var(--bg);stroke:var(--accent);stroke-width:2}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:560px}
nav button{border:0;background:transparent;font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-height:48px}
nav button[aria-current=page]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:20;max-width:90%}
.note{font-size:13px;color:var(--muted)}
.timer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));z-index:5;display:flex;justify-content:center}
.timer-in{width:100%;max-width:560px;background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.timer.run .timer-in{background:var(--accent);color:var(--accent-ink)}
.timer b{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;display:block}
.timer .label{color:inherit;opacity:.75}
.timer button{background:var(--bg);color:var(--ink);border-color:transparent}
.timer label{display:flex;gap:6px;align-items:center;font-size:14px}
.timer input[type=checkbox]{width:auto;min-height:0}
.rest-card{flex-direction:row;align-items:center;justify-content:space-between}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .12s,background .12s}}
</style>

<div class="wrap" id="app"><p class="empty">Loading your log…</p></div>
<nav><div class="tabs" id="tabs"></div></nav>
<div class="timer" id="timer" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = (n) => String(n).padStart(2, "0");
const dstr = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => dstr(new Date());
const fmtDate = (s) => new Date(s + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmtN = (n) => (Math.round(n * 10) / 10).toString();
const norm = (s) => s.trim().toLowerCase();
const uid6 = () => Math.random().toString(36).slice(2, 8);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// Starter split. It is only a template; every name and exercise can be edited on the Split tab.
const DEFAULT_PROFILE = {
  unit: "kg",
  split: [
    { id: "d1", name: "Push", exercises: ["Bench Press", "Overhead Press", "Incline Dumbbell Press", "Lateral Raise", "Triceps Pushdown"] },
    { id: "d2", name: "Pull", exercises: ["Deadlift", "Barbell Row", "Lat Pulldown", "Face Pull", "Barbell Curl"] },
    { id: "d3", name: "Legs", exercises: ["Back Squat", "Romanian Deadlift", "Leg Press", "Leg Curl", "Calf Raise"] },
  ],
};

const S = { ready: false, tab: "log", profile: structuredClone(DEFAULT_PROFILE), workouts: [], draft: lsGet("lift-draft", null), pex: null, confirm: null, mode: "local" };
let store = null;

/* ---------- storage: private db per viewer, falling back to this device ---------- */
async function initStore() {
  let db = null, uid = null;
  try {
    if (window.claude && claude.use) {
      const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (d && u) { uid = await u.id(); if (uid) db = d; }
    }
  } catch (e) { db = null; }

  if (db) {
    const pdoc = db.doc("data/users/" + uid + "/profile");
    const wcol = pdoc.collection("workouts");
    S.mode = "cloud";
    pdoc.onSnapshot((snap) => { if (snap.exists) S.profile = Object.assign(structuredClone(DEFAULT_PROFILE), snap.data()); softRender(); }, () => {});
    wcol.onSnapshot((snap) => { S.workouts = sortW(snap.docs.map((d) => Object.assign({ id: d.id }, d.data()))); S.ready = true; softRender(); }, () => { S.ready = true; softRender(); });
    return {
      saveProfile: (p) => pdoc.set(p),
      saveWorkout: (w) => { const { id, ...rest } = w; return wcol.doc(id).set(rest); },
      deleteWorkout: (id) => wcol.doc(id).delete(),
    };
  }
  S.profile = Object.assign(structuredClone(DEFAULT_PROFILE), lsGet("lift-profile", {}));
  S.workouts = sortW(lsGet("lift-workouts", []));
  S.ready = true;
  return {
    saveProfile: async (p) => lsSet("lift-profile", p),
    saveWorkout: async (w) => { S.workouts = sortW([w, ...S.workouts.filter((x) => x.id !== w.id)]); lsSet("lift-workouts", S.workouts); },
    deleteWorkout: async (id) => { S.workouts = S.workouts.filter((x) => x.id !== id); lsSet("lift-workouts", S.workouts); },
  };
}
const sortW = (a) => a.slice().sort((x, y) => (y.date + String(y.ts || 0)).localeCompare(x.date + String(x.ts || 0)));

async function persist(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast("Could not save. Try again."); }
  render();
}

/* ---------- derived data ---------- */
const sameEx = (a, b) => norm(a) === norm(b);
function lastFor(ex) {
  for (const w of S.workouts) for (const e of w.entries) if (sameEx(e.ex, ex)) return { date: w.date, sets: e.sets };
  return null;
}
function allExercises() {
  const set = new Map();
  S.profile.split.forEach((d) => d.exercises.forEach((e) => set.set(norm(e), e)));
  S.workouts.forEach((w) => w.entries.forEach((e) => { if (!set.has(norm(e.ex))) set.set(norm(e.ex), e.ex); }));
  return [...set.values()].sort((a, b) => a.localeCompare(b));
}
const volume = (w) => w.entries.reduce((t, e) => t + e.sets.reduce((s, x) => s + num(x.w) * num(x.r), 0), 0);
const e1rm = (s) => (num(s.r) > 0 ? num(s.w) * (1 + num(s.r) / 30) : 0);
function weekStart() { const d = new Date(); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return dstr(d); }
function nextDayId() {
  const split = S.profile.split;
  if (!split.length) return null;
  const last = S.workouts.find((w) => split.some((d) => d.id === w.dayId));
  if (!last) return split[0].id;
  const i = split.findIndex((d) => d.id === last.dayId);
  return split[(i + 1) % split.length].id;
}
const setsText = (sets) => sets.map((s) => fmtN(num(s.w)) + "×" + fmtN(num(s.r))).join(", ");

/* ---------- views ---------- */
function viewLog() {
  const u = S.profile.unit;
  if (!S.draft) {
    const ws = weekStart();
    const wk = S.workouts.filter((w) => w.date >= ws && !w.rest);
    const last = S.workouts[0];
    const lastW = S.workouts.find((w) => !w.rest);
    const next = nextDayId();
    const days = S.profile.split.map((d) => `
      <button class="day-btn${d.id === next ? " next" : ""}" data-act="start" data-id="${esc(d.id)}">
        ${d.id === next ? '<span class="tag">Up next</span>' : ""}
        <h3>${esc(d.name)}</h3><small>${d.rest ? "Log a rest day" : d.exercises.length + " exercises"}</small>
      </button>`).join("");
    return `
      <div class="top"><h1>Today</h1><span class="date">${fmtDate(today())}</span></div>
      <div class="stats">
        <div class="stat"><span class="label">This week</span><b>${wk.length}</b></div>
        <div class="stat"><span class="label">Volume (${u})</span><b>${Math.round(wk.reduce((t, w) => t + volume(w), 0)).toLocaleString()}</b></div>
        <div class="stat"><span class="label">Last</span><b>${last ? esc(last.dayName).slice(0, 10) : "None"}</b></div>
      </div>
      <div class="card">
        <span class="label">Start a workout</span>
        <div class="chips">${days}<button class="day-btn" data-act="start" data-id="free"><h3>Freestyle</h3><small>Pick exercises as you go</small></button></div>
      </div>
      ${lastW ? `<div class="card"><span class="label">Last session · ${fmtDate(lastW.date)}</span><h3>${esc(lastW.dayName)}</h3>${lastW.entries.map((e) => `<div class="hist-line"><span>${esc(e.ex)}</span><span>${setsText(e.sets)}</span></div>`).join("")}</div>` : ""}`;
  }
  const d = S.draft;
  const cards = d.entries.map((e, i) => {
    const last = lastFor(e.ex);
    const sets = e.sets.map((s, j) => {
      const ref = last ? last.sets[Math.min(j, last.sets.length - 1)] : null;
      return `<div class="set"><span class="n">${j + 1}</span>
        <input type="number" inputmode="decimal" step="any" aria-label="Weight, set ${j + 1}" data-f="w" data-e="${i}" data-s="${j}" value="${esc(s.w)}" placeholder="${ref ? fmtN(num(ref.w)) : "0"}">
        <span class="x">×</span>
        <input type="number" inputmode="numeric" aria-label="Reps, set ${j + 1}" data-f="r" data-e="${i}" data-s="${j}" value="${esc(s.r)}" placeholder="${ref ? fmtN(num(ref.r)) : "0"}">
        <button class="ghost" aria-label="Remove set ${j + 1}" data-act="rmSet" data-e="${i}" data-s="${j}">✕</button></div>`;
    }).join("");
    return `<div class="card">
      <div class="ex-head"><div><h3>${esc(e.ex)}</h3><div class="last">${last ? "Last " + fmtDate(last.date) + ": " + setsText(last.sets) : "First time logging this"}</div></div>
      <button class="ghost small danger" data-act="rmEx" data-e="${i}" aria-label="Remove ${esc(e.ex)}">Remove</button></div>
      <div class="colhead label"><span></span><span>${u}</span><span></span><span>reps</span><span></span></div>
      ${sets}
      <button class="small" data-act="addSet" data-e="${i}">+ Add set</button></div>`;
  }).join("");
  return `
    <div class="top"><h1>${esc(d.dayName)}</h1><span class="date">${fmtDate(d.date)}</span></div>
    ${cards || '<p class="empty">No exercises yet. Add one below.</p>'}
    <div class="card"><span class="label">Add exercise</span>
      <div class="row"><input type="text" id="newEx" list="exlist" placeholder="Exercise name" data-enter="addEx" data-input="newEx" autocomplete="off"><button data-act="addEx" data-input="newEx">Add</button></div>
      <datalist id="exlist">${allExercises().map((x) => `<option value="${esc(x)}">`).join("")}</datalist></div>
    <div class="row"><button class="primary" style="flex:1" data-act="finish">Finish workout</button>
      <button class="ghost${S.confirm === "discard" ? " danger" : ""}" data-act="discard">${S.confirm === "discard" ? "Tap again to discard" : "Discard"}</button></div>`;
}

function viewSplit() {
  const days = S.profile.split.map((d) => d.rest ? `
    <div class="card rest-card">
      <div><h3>${esc(d.name)}</h3><div class="last">Rest day · no exercises</div></div>
      <button class="ghost small${S.confirm === "day" + d.id ? " danger" : ""}" data-act="delDay" data-id="${esc(d.id)}">${S.confirm === "day" + d.id ? "Confirm" : "Delete"}</button>
    </div>` : `
    <div class="card">
      <div class="row"><input type="text" value="${esc(d.name)}" aria-label="Day name" data-act-change="renameDay" data-id="${esc(d.id)}">
        <button class="ghost small${S.confirm === "day" + d.id ? " danger" : ""}" data-act="delDay" data-id="${esc(d.id)}">${S.confirm === "day" + d.id ? "Confirm" : "Delete"}</button></div>
      <ul class="list">${d.exercises.map((x, i) => `<li><span>${esc(x)}</span><button class="ghost small" aria-label="Remove ${esc(x)}" data-act="delEx" data-id="${esc(d.id)}" data-i="${i}">✕</button></li>`).join("") || '<li class="empty">No exercises</li>'}</ul>
      <div class="row"><input type="text" id="add-${esc(d.id)}" list="exlist2" placeholder="Add exercise" data-enter="addSplitEx" data-input="add-${esc(d.id)}" data-id="${esc(d.id)}" autocomplete="off"><button data-act="addSplitEx" data-input="add-${esc(d.id)}" data-id="${esc(d.id)}">Add</button></div>
    </div>`).join("");
  return `
    <div class="top"><h1>My split</h1></div>
    <p class="note" style="margin:0">Days run in order. The Today tab suggests the next one after your last session.</p>
    ${days}
    <datalist id="exlist2">${allExercises().map((x) => `<option value="${esc(x)}">`).join("")}</datalist>
    <div class="row"><button style="flex:1" data-act="addDay">+ Training day</button><button style="flex:1" data-act="addRest">+ Rest day</button></div>
    <div class="card"><div class="row" style="justify-content:space-between"><span class="label">Weight unit</span>
      <div class="seg"><button data-act="unit" data-u="kg" aria-pressed="${S.profile.unit === "kg"}">kg</button><button data-act="unit" data-u="lb" aria-pressed="${S.profile.unit === "lb"}">lb</button></div></div>
      <p class="note" style="margin:0">Changing the unit only changes the label. Logged numbers are not converted.</p></div>
    <div class="card"><span class="label">Backup</span>
      <p class="note" style="margin:0">${S.mode === "local" ? "Your log lives in this browser. Export a backup now and then, so clearing site data or changing phones doesn't wipe it." : "Your log is saved to your account. A backup file is optional."}</p>
      <div class="row"><button style="flex:1" data-act="exportData">Export backup</button><button style="flex:1" data-act="importPick">Import backup</button></div>
      <input type="file" id="importFile" accept="application/json,.json" hidden></div>`;
}

function chartSvg(pts, unit) {
  const W = 320, H = 170, L = 38, R = 12, T = 12, B = 26;
  const ts = pts.map((p) => p.t), vs = pts.map((p) => p.v);
  let t0 = Math.min(...ts), t1 = Math.max(...ts); if (t0 === t1) { t0 -= 864e5 * 3; t1 += 864e5 * 3; }
  let v0 = Math.min(...vs), v1 = Math.max(...vs); if (v0 === v1) { v0 -= 5; v1 += 5; }
  const padv = (v1 - v0) * 0.1; v0 = Math.max(0, v0 - padv); v1 += padv;
  const x = (t) => L + ((t - t0) / (t1 - t0)) * (W - L - R);
  const y = (v) => T + (1 - (v - v0) / (v1 - v0)) * (H - T - B);
  const ticks = [v0, (v0 + v1) / 2, v1];
  const grid = ticks.map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${fmtN(v)}</text>`).join("");
  const line = pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const dots = pts.map((p, i) => `<circle class="${i === pts.length - 1 ? "end" : "dot"}" cx="${x(p.t)}" cy="${y(p.v)}" r="${i === pts.length - 1 ? 5 : 3}"/>`).join("");
  const dl = (t) => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Top set weight over time">${grid}
    <path class="ln" d="${line}"/>${dots}
    <text x="${L}" y="${H - 6}" text-anchor="start">${dl(pts[0].t)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${dl(pts[pts.length - 1].t)}</text>
    <text x="${L}" y="${T - 2}" text-anchor="start" style="display:none">${unit}</text></svg>`;
}

function viewProgress() {
  const exs = allExercises();
  const u = S.profile.unit;
  if (!S.pex || !exs.some((e) => sameEx(e, S.pex))) S.pex = (exs.find((e) => lastFor(e)) || exs[0] || "");
  const opts = exs.map((e) => `<option${sameEx(e, S.pex) ? " selected" : ""}>${esc(e)}</option>`).join("");
  const sessions = [];
  for (const w of S.workouts) for (const e of w.entries) if (sameEx(e.ex, S.pex)) sessions.push({ date: w.date, sets: e.sets });
  const asc = sessions.slice().reverse();
  const pts = asc.map((s) => ({ t: new Date(s.date + "T12:00:00").getTime(), v: Math.max(...s.sets.map((x) => num(x.w))) })).filter((p) => p.v > 0);
  const pr = sessions.flatMap((s) => s.sets).reduce((m, s) => Math.max(m, num(s.w)), 0);
  const best1 = sessions.flatMap((s) => s.sets).reduce((m, s) => Math.max(m, e1rm(s)), 0);
  let body;
  if (!sessions.length) body = '<div class="card"><p class="empty" style="margin:0">Nothing logged for this exercise yet. Finish a workout to see your trend here.</p></div>';
  else body = `
    <div class="stats">
      <div class="stat"><span class="label">Best (${u})</span><b>${fmtN(pr)}</b></div>
      <div class="stat"><span class="label">Est. 1RM</span><b>${fmtN(best1)}</b></div>
      <div class="stat"><span class="label">Sessions</span><b>${sessions.length}</b></div>
    </div>
    <div class="card"><span class="label">Top set per session (${u})</span>${pts.length ? chartSvg(pts, u) : ""}
      ${pts.length < 2 ? '<p class="note" style="margin:0">Log this lift in one more session to see a trend line.</p>' : ""}</div>
    <div class="card"><span class="label">Recent sessions</span>${sessions.slice(0, 8).map((s) => `<div class="hist-line"><span>${fmtDate(s.date)}</span><span>${setsText(s.sets)}</span></div>`).join("")}</div>`;
  return `<div class="top"><h1>Progress</h1></div>
    ${exs.length ? `<select id="pex" aria-label="Exercise">${opts}</select>${body}` : '<div class="card"><p class="empty" style="margin:0">Add exercises to your split or log a workout first.</p></div>'}`;
}

function viewHistory() {
  const u = S.profile.unit;
  const items = S.workouts.map((w) => `
    <div class="card">
      <div class="ex-head"><div><h3>${esc(w.dayName)}</h3><div class="last">${fmtDate(w.date)} · ${w.rest ? "Rest day" : Math.round(volume(w)).toLocaleString() + " " + u + " volume"}</div></div>
      <button class="ghost small${S.confirm === "w" + w.id ? " danger" : ""}" data-act="delW" data-id="${esc(w.id)}">${S.confirm === "w" + w.id ? "Confirm" : "Delete"}</button></div>
      ${w.entries.map((e) => `<div class="hist-line"><span>${esc(e.ex)}</span><span>${setsText(e.sets)}</span></div>`).join("")}
    </div>`).join("");
  return `<div class="top"><h1>History</h1><span class="date">${S.workouts.length} workouts</span></div>
    ${items || '<div class="card"><p class="empty" style="margin:0">No workouts yet. Start one from the Today tab.</p></div>'}`;
}

/* ---------- render ---------- */
const TABS = [["log", "Today"], ["split", "Split"], ["progress", "Progress"], ["history", "History"]];
function render() {
  $("#tabs").innerHTML = TABS.map(([k, n]) => `<button data-act="tab" data-t="${k}"${S.tab === k ? ' aria-current="page"' : ""}>${n}</button>`).join("");
  if (!S.ready) return;
  const v = { log: viewLog, split: viewSplit, progress: viewProgress, history: viewHistory }[S.tab]();
  const foot = S.mode === "local" ? '<p class="note">Saved on this device only. Open the page signed in to keep your log across devices.</p>' : "";
  $("#app").innerHTML = v + foot;
  drawTimer();
}
// Snapshots from the db must not steal focus from a field the user is typing in.
function softRender() { const a = document.activeElement; if (a && a.tagName === "INPUT" && $("#app").contains(a)) return; render(); }
let tt;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2200); }
const saveDraft = () => lsSet("lift-draft", S.draft);
const cleanConfirm = (k) => { if (S.confirm !== k) S.confirm = null; };

/* ---------- actions ---------- */
function newSets(ex) { const l = lastFor(ex); const n = l ? l.sets.length : 3; return Array.from({ length: n }, () => ({ w: "", r: "" })); }
const inputVal = (el) => { const i = document.getElementById(el.dataset.input); const v = i ? i.value.trim() : ""; if (i) i.value = ""; return v; };
const saveProfile = (msg) => persist(() => store.saveProfile(S.profile), msg);

const ACTIONS = {
  tab(el) { S.tab = el.dataset.t; S.confirm = null; render(); window.scrollTo(0, 0); },
  start(el) {
    const d = S.profile.split.find((x) => x.id === el.dataset.id);
    if (d && d.rest) return logRest(d);
    S.draft = { date: today(), dayId: d ? d.id : "free", dayName: d ? d.name : "Freestyle", entries: d ? d.exercises.map((ex) => ({ ex, sets: newSets(ex) })) : [] };
    saveDraft(); render();
  },
  addEx(el) { const v = inputVal(el); if (!v) return; S.draft.entries.push({ ex: v, sets: newSets(v) }); saveDraft(); render(); },
  rmEx(el) { S.draft.entries.splice(+el.dataset.e, 1); saveDraft(); render(); },
  addSet(el) { const e = S.draft.entries[+el.dataset.e]; const p = e.sets[e.sets.length - 1]; e.sets.push({ w: p ? p.w : "", r: "" }); saveDraft(); render(); },
  rmSet(el) { S.draft.entries[+el.dataset.e].sets.splice(+el.dataset.s, 1); saveDraft(); render(); },
  async finish() {
    const entries = S.draft.entries
      .map((e) => ({ ex: e.ex, sets: e.sets.filter((s) => num(s.r) > 0).map((s) => ({ w: num(s.w), r: num(s.r) })) }))
      .filter((e) => e.sets.length);
    if (!entries.length) return toast("Enter reps for at least one set.");
    const ts = Date.now();
    const w = { id: S.draft.date + "-" + ts.toString(36), ts, date: S.draft.date, dayId: S.draft.dayId, dayName: S.draft.dayName, entries };
    S.draft = null; saveDraft(); S.confirm = null;
    await persist(() => store.saveWorkout(w), "Workout saved");
    S.tab = "history"; render();
  },
  discard() { if (S.confirm !== "discard") { S.confirm = "discard"; return render(); } S.draft = null; S.confirm = null; saveDraft(); render(); },
  renameDay(el) { const d = S.profile.split.find((x) => x.id === el.dataset.id); const v = el.value.trim(); if (d && v && v !== d.name) { d.name = v; saveProfile("Renamed"); } },
  delDay(el) { const k = "day" + el.dataset.id; if (S.confirm !== k) { S.confirm = k; return render(); } S.profile.split = S.profile.split.filter((x) => x.id !== el.dataset.id); S.confirm = null; saveProfile(); },
  addDay() { S.profile.split.push({ id: "d" + uid6(), name: "Day " + (S.profile.split.length + 1), exercises: [] }); saveProfile(); },
  addRest() { S.profile.split.push({ id: "d" + uid6(), name: "Rest", rest: true, exercises: [] }); saveProfile(); },
  addSplitEx(el) { const v = inputVal(el); const d = S.profile.split.find((x) => x.id === el.dataset.id); if (!v || !d || d.exercises.some((x) => sameEx(x, v))) return; d.exercises.push(v); saveProfile(); },
  delEx(el) { const d = S.profile.split.find((x) => x.id === el.dataset.id); d.exercises.splice(+el.dataset.i, 1); saveProfile(); },
  unit(el) { S.profile.unit = el.dataset.u; saveProfile(); },
  exportData,
  importPick() { $("#importFile").click(); },
  restStart() { if (R.end) { R.end = 0; drawTimer(); } else startRest(); },
  restAdd() { R.end = (R.end || Date.now()) + 30000; drawTimer(); },
  delW(el) { const k = "w" + el.dataset.id; if (S.confirm !== k) { S.confirm = k; return render(); } S.confirm = null; persist(() => store.deleteWorkout(el.dataset.id), "Deleted"); },
};

/* ---------- rest timer (3:00) ---------- */
const REST_SECS = 180;
const R = { end: 0, auto: lsGet("lift-auto", true), ctx: null };
const fmtT = (s) => Math.floor(s / 60) + ":" + pad(s % 60);
function audio() { try { R.ctx = R.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (R.ctx.resume) R.ctx.resume(); } catch (e) {} }
function beep() {
  try {
    audio(); const o = R.ctx.createOscillator(), g = R.ctx.createGain();
    o.connect(g); g.connect(R.ctx.destination); o.frequency.value = 880; g.gain.value = 0.2; o.start(); o.stop(R.ctx.currentTime + 0.5);
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) {}
}
function startRest() { audio(); R.end = Date.now() + REST_SECS * 1000; drawTimer(); }
function drawTimer() {
  const el = $("#timer");
  if (!S.draft) { el.hidden = true; R.end = 0; return; }
  if (el.hidden || !el.firstChild) {
    el.hidden = false;
    el.innerHTML = '<div class="timer-in"><div><span class="label">Rest timer</span><b id="tm">3:00</b></div><div class="row"><button class="small" id="tmStart" data-act="restStart">Start</button><button class="small" data-act="restAdd">+30s</button><label><input type="checkbox" id="auto"> Auto</label></div></div>';
  }
  const left = R.end ? Math.max(0, Math.ceil((R.end - Date.now()) / 1000)) : REST_SECS;
  $("#tm").textContent = fmtT(left);
  $("#tmStart").textContent = R.end ? "Reset" : "Start";
  $("#auto").checked = R.auto;
  el.classList.toggle("run", !!R.end);
}
setInterval(() => {
  if (R.end && Date.now() >= R.end) { R.end = 0; if (S.draft) { beep(); toast("Rest over. Next set."); } }
  if (S.draft) drawTimer();
}, 250);
async function exportData() {
  const data = JSON.stringify({ app: "ironbook", v: 1, profile: S.profile, workouts: S.workouts }, null, 1);
  const name = "ironbook-backup-" + today() + ".json";
  try {
    const dl = window.claude && claude.use ? await claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name, data }); return toast("Backup ready"); }
  } catch (e) { return toast("Backup cancelled"); }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast("Backup downloaded");
}
async function importData(file) {
  try {
    const j = JSON.parse(await file.text());
    if (j.app !== "ironbook" || !Array.isArray(j.workouts) || !j.profile) throw new Error("bad");
    S.profile = Object.assign(structuredClone(DEFAULT_PROFILE), j.profile);
    await store.saveProfile(S.profile);
    for (const w of j.workouts) await store.saveWorkout(w);
    toast("Imported " + j.workouts.length + " workouts");
  } catch (e) { toast("That file isn't an Ironbook backup."); }
  render();
}
async function logRest(d) {
  const ts = Date.now();
  const w = { id: today() + "-" + ts.toString(36), ts, date: today(), dayId: d.id, dayName: d.name, rest: true, entries: [] };
  await persist(() => store.saveWorkout(w), "Rest day logged");
}

document.addEventListener("click", (ev) => { const el = ev.target.closest("[data-act]"); if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el); });
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.f && S.draft) { S.draft.entries[+t.dataset.e].sets[+t.dataset.s][t.dataset.f] = t.value; saveDraft(); }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "importFile") { if (t.files[0]) importData(t.files[0]); t.value = ""; }
  else if (t.id === "auto") { R.auto = t.checked; lsSet("lift-auto", R.auto); }
  else if (t.dataset.f === "r" && S.draft && R.auto && num(t.value) > 0) startRest();
  else if (t.id === "pex") { S.pex = t.value; render(); }
  else if (t.dataset.actChange) ACTIONS[t.dataset.actChange](t);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.enter) { ev.preventDefault(); ACTIONS[ev.target.dataset.enter](ev.target); }
});

render();
initStore().then((s) => { store = s; render(); });
</script>
